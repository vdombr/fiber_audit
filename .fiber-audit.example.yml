# FiberAudit configuration example
static:
  # Globs are evaluated from the detected project root.
  include:
    - app/**/*.rb
    - lib/**/*.rb
    - config/**/*.rb
  exclude:
    - vendor/**/*
    - tmp/**/*
    - node_modules/**/*
    - db/schema.rb

  # Optional YAML suppressions. Every entry must include a reason.
  # suppressions_path: .fiber-audit-suppressions.yml

rules:
  FA1007:
    enabled: false
  FA1003:
    severity: low

report:
  formats:
    - text
    - json
  # critical, high, medium, low, or info. Default low hides info findings.
  min_severity: low

# Used only by explicit `fiber-audit runtime -- COMMAND` activation.
runtime:
  redaction:
    mode: strict
  sampling:
    rate: 0.1
  overhead:
    max_events_per_second: 100
    max_events_per_session: 10000
    max_record_bytes: 16384
    max_session_bytes: 10485760
  watchdog:
    enabled: true
    heartbeat_interval_ms: 25
    stall_threshold_ms: 100
    max_frames: 20
  # Independent operation-age evidence. The threshold is exclusive.
  operation_liveness:
    enabled: true
    poll_interval_ms: 100
    long_active_threshold_ms: 1000
  # Optional bounded ownership/wait graph. Disabled by default.
  synchronization_graph:
    enabled: false
    max_identities: 4096
    max_resources: 2048
    max_wait_edges: 2048
    max_cycle_depth: 64
  # Optional parent-observed process progress. Disabled by default.
  process_progress:
    enabled: false
    heartbeat_interval_ms: 50
    stall_threshold_ms: 250
    max_processes: 1024
    max_frames_per_poll: 256
    max_buffer_bytes: 65536
  fail_open: true
