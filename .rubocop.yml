AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'node_modules/**/*'
    - 'spec/fixtures/**/*'
    - 'Gemfile.lock'
    - '**/*.md'
    - '**/*.json'
    - '**/*.gem'
    - '.fiber-audit.example.yml'

# RSpec DSL blocks (describe/context/it) legitimately span many lines;
# scoped exclusion is preferable to a global disable.
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Metrics/MethodLength:
  Max: 40
  Exclude:
    - 'spec/**/*'

# Adapter/CLI classes accumulate substantial branching and reporting logic;
# raising the limit avoids noisy splits while still catching bloat.
Metrics/ClassLength:
  Max: 250

# Documentation is not required for 0.1.0
Style/Documentation:
  Enabled: false

# Explicit frozen_string_literal pragma required in every Ruby source file.
Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

# Allow parameter lists up to 15 for data classes
Metrics/ParameterLists:
  Max: 15

# ABC size and complexity can be higher for this codebase
Metrics/AbcSize:
  Max: 30

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/PerceivedComplexity:
  Max: 15

# Line length
Layout/LineLength:
  Max: 125

# Data.define can override :method
Lint/DataDefineOverride:
  Enabled: false
